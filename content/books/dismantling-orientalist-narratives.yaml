quote: The aim is to provide a comprehensive refutation of the orientalist narratives and restore the trust in the authority and reliability of Hadith.
inside:
  - Named claims of Juynboll, Goldziher, Schacht and Calder, tested one by one against manuscripts, biographies and isnad analysis
  - Refutation of Goldziher's evidence that Mu'awiyah and Mughirah fabricated ahadith (p. 83)
  - Refutation that Abu Hurayra fabricated hadith (p. 92)
  - Preservation of hadith through travels in search of hadith
